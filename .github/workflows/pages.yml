name: Project website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: project-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      manifest_sha256: ${{ steps.integrity.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Generate the static site and verify links
        run: npm run site:build
      - name: Verify the Pages inventory and record its digest
        id: integrity
        run: npm run site:verify
      - name: Build the Wiki mirrors
        run: npm run wiki:build
      - name: Verify the release and hosted proof records
        run: npm run reproduce
      - name: Upload the website only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 1

  attest:
    name: Attest Pages manifest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Sign the manifest from the build job
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: deployment.json
          subject-digest: sha256:${{ needs.build.outputs.manifest_sha256 }}
          push-to-registry: false
          create-storage-record: false

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-published:
    name: Verify published website bytes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out the exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Rebuild the source independently
        run: npm run site:build
      - name: Compare all served files and the manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: npm run site:verify -- --live
